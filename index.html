<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>면접 준비실</title><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* 영석고 면접 아카이브와 같은 계열: 따뜻한 흰 바탕, 주황 강조, 남색 글자, 둥근 카드.
   레이아웃: 위에 고정 머리줄 → 남색 띠(첫 화면) → 카드 한 장씩. */
:root{
  --orange:#f36a21; --orange-d:#c9500f; --orange-s:#fff1e7; --orange-line:#f6cfb7;
  --ink:#172033; --text:#2a303c; --muted:#697181; --line:#ece6e0; --line2:#f3eee9;
  --bg:#fffaf6; --card:#ffffff; --soft:#fbf6f1; --sticker:#ffffff; --navy:#0f1a33;
  --blue:#2f64d6; --blue-s:#eaf0fd; --green:#16875c; --green-s:#e5f5ee;
  --purple:#7446d4; --purple-s:#f0eafc; --red:#d23d4b; --red-s:#fdecee;
  --amber:#b7791f; --amber-s:#fdf3e1; --gold:#f0a400;
  --cookie:#3a2a22; --cream:#fff7e3;
  --shadow:0 14px 40px rgba(23,32,51,.07); --r:16px; --ease:cubic-bezier(.2,.8,.2,1);
  --body:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --orange:#ff8a4c; --orange-d:#ffa06c; --orange-s:#3a2418; --orange-line:#5a3624;
  --ink:#f3eee9; --text:#dcd6d0; --muted:#a39b94; --line:#34302d; --line2:#2b2826;
  --bg:#1a1817; --card:#232120; --soft:#2a2725; --sticker:#f4f0ec; --navy:#0f1a33;
  --blue:#86a8ff; --blue-s:#1f2a44; --green:#5fd3a0; --green-s:#17342a;
  --purple:#b69bff; --purple-s:#2c2345; --red:#ff8a94; --red-s:#3e1f23;
  --amber:#f0c060; --amber-s:#3a2f17; --gold:#ffc94a;
  --shadow:0 14px 40px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --orange:#ff8a4c; --orange-d:#ffa06c; --orange-s:#3a2418; --orange-line:#5a3624;
  --ink:#f3eee9; --text:#dcd6d0; --muted:#a39b94; --line:#34302d; --line2:#2b2826;
  --bg:#1a1817; --card:#232120; --soft:#2a2725; --sticker:#f4f0ec; --navy:#0f1a33;
  --blue:#86a8ff; --blue-s:#1f2a44; --green:#5fd3a0; --green-s:#17342a;
  --purple:#b69bff; --purple-s:#2c2345; --red:#ff8a94; --red-s:#3e1f23;
  --amber:#f0c060; --amber-s:#3a2f17; --gold:#ffc94a;
  --shadow:0 14px 40px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15.5px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;color:var(--ink)}
p{text-wrap:pretty}
img{-webkit-user-drag:none;user-select:none}
.app{max-width:880px;margin-inline:auto;padding:22px 16px 72px}
.col{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mono{font-size:.74rem;letter-spacing:.12em;font-weight:800;color:var(--orange);text-transform:uppercase}

/* 머리줄 */
.top{position:relative;z-index:40;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:auto;padding:0 16px;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 0;text-align:left;min-width:0}
.brand .logo{width:38px;height:38px;flex:none;display:block}
.brand small{display:block;color:var(--muted);font-size:.72rem;line-height:1.2;white-space:nowrap}
.brand b{display:block;color:var(--ink);font-size:1.02rem;line-height:1.25;letter-spacing:-.02em;white-space:nowrap}
.top .right{display:flex;gap:8px;align-items:center;flex:none}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.84rem;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill b{color:var(--gold)}
button.pill{color:var(--muted);transition:border-color .15s,color .15s}
button.pill:hover{border-color:var(--orange-line);color:var(--ink)}
button.pill[aria-pressed="true"]{color:var(--orange);background:var(--orange-s);border-color:var(--orange-line)}

/* 버튼 */
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:800;background:var(--orange);color:#fff;white-space:nowrap;text-decoration:none;display:inline-block;transition:transform .12s var(--ease),background-color .15s,border-color .15s,color .15s}
.btn:hover{background:var(--orange-d)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;background:var(--orange)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:11px 19px}
.btn.ghost:hover{border-color:var(--orange);color:var(--orange)}
.link{background:none;border:0;padding:6px 2px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.88rem;font-weight:600}
.link:hover{color:var(--orange)}

/* 카드 */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:16px;position:relative}
.card h2{font-size:clamp(1.35rem,3.2vw,1.7rem);font-weight:850;letter-spacing:-.03em;line-height:1.3}
h3.sec{font-size:1.02rem;font-weight:800;letter-spacing:-.02em}

/* 첫 화면 띠 */
.heroband{border-radius:26px;background-color:var(--navy);color:#eef2fb;padding:clamp(22px,4.4vw,40px);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;
  background-image:radial-gradient(circle at 94% 6%,rgba(242,106,33,.4),transparent 36%),radial-gradient(circle at 0% 100%,rgba(76,110,190,.35),transparent 42%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:auto,auto,28px 28px,28px 28px}
.heroband .mono{color:#ffb386}
.heroband h1{font-size:clamp(2.3rem,7vw,3.6rem);line-height:1.1;letter-spacing:-.045em;font-weight:900;color:#fff}
.heroband h1 em{font-style:normal;color:#ff9a5c}
.heroband .lede{color:#c3cbe0;font-size:1rem}
@media (min-width:760px){ .heroband .lede{white-space:nowrap} }
.parade{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:8px}
.parade img{height:100%;width:auto;animation:bob 1.8s ease-in-out infinite}
.parade img:nth-child(2n){animation-delay:.3s} .parade img:nth-child(3n){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-5px)}}
.card>.parade{height:58px;margin:0}

/* 수험표 발급 */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-weight:800;font-size:.9rem;color:var(--ink)}
.field input[type=text]{border:1.5px solid var(--line);border-radius:12px;-webkit-appearance:none;appearance:none;background:var(--card);padding:11px 14px;font-size:1.05rem;width:100%;color:var(--ink)}
.field input[type=text]:focus{outline:0;border-color:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 18%,transparent)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{border:1.5px solid var(--line);border-radius:12px;padding:8px 16px;cursor:pointer;font-weight:800;background:var(--card);color:var(--muted);display:flex;align-items:center;gap:6px;transition:border-color .15s,background-color .15s,transform .12s var(--ease)}
.seg label:hover{border-color:var(--orange-line)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label.on{border-color:var(--orange);background:var(--orange-s);color:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 16%,transparent)}
.seg.mas label{padding:8px 10px;background:var(--sticker);border-radius:14px}
.seg.mas label.on{background:var(--sticker)}
.seg.mas img{height:52px;width:auto}
.err{color:var(--red);font-weight:800;font-size:.88rem}
.err:empty{display:none}
.rules{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rules li{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:.9rem;color:var(--muted)}
.rules b{display:block;color:var(--ink);font-size:.98rem;margin-bottom:2px}
.heart{color:var(--red)}
.q-sub{font-size:.86rem;color:var(--muted)}

/* 노선도 */
.ticket{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow)}
.ticket .ava{width:68px;height:68px;border-radius:18px;background:var(--sticker);border:1px solid var(--line);display:grid;place-items:center}
.ticket .ava img{max-width:54px;max-height:54px}
.ticket .who{font-size:1.3rem;font-weight:850;letter-spacing:-.02em;color:var(--ink);line-height:1.3}
.ticket .stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.86rem;color:var(--muted);align-items:center}
.ticket .stats b{color:var(--ink)}
.route{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.stop{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px 12px 12px;transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .2s}
@media (hover:hover){ .stop:hover{transform:translateY(-2px);border-color:var(--orange-line);box-shadow:0 16px 36px -14px rgba(23,32,51,.22)} }
.stop:active{transform:scale(.99)}
.stop .dot{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;background:var(--sticker);border:1px solid var(--line2);position:relative}
.stop .dot img{max-width:44px;max-height:42px}
.stop .dot .no{position:absolute;left:-6px;top:-6px;font-size:.72rem;font-weight:900;color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.stop .name{font-size:1.06rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.35;display:block}
.stop .sub{font-size:.84rem;color:var(--muted);display:block}
.stop .rec{display:flex;flex-direction:column;align-items:flex-end;gap:0;white-space:nowrap}
.stars{font-size:1.02rem;letter-spacing:1px;color:var(--gold)}
.stars .off{color:var(--line)}
.stop .pts{font-size:.76rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.stop .none{font-size:.74rem;font-weight:800;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 9px}
.lock{border:1px dashed var(--orange-line);border-radius:var(--r);background:var(--card);padding:14px 16px;color:var(--muted);display:flex;gap:12px;align-items:center;font-size:.9rem}
.lock img{height:42px;width:auto}
.note{border-top:1px solid var(--line);margin-top:26px;padding-top:20px;display:flex;flex-direction:column;gap:10px;color:var(--muted);font-size:.82rem;line-height:1.7}
.note b{color:var(--ink)}
.note-top{display:flex;justify-content:space-between;gap:4px 16px;flex-wrap:wrap}
.note .copy{background:var(--orange-s);border:1px solid var(--orange-line);border-radius:12px;padding:10px 14px;color:var(--text)}
.note .copy b{color:var(--orange-d)}

/* HUD */
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:color-mix(in srgb,var(--card) 94%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:8px 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:30;box-shadow:0 6px 20px rgba(23,32,51,.06)}
.hud .me{display:flex;align-items:center;gap:8px;min-width:0}
.hud .me img{height:32px;width:auto}
.hud .hearts{font-size:1.15rem;letter-spacing:2px;color:var(--red);white-space:nowrap}
.hud .hearts .off{color:var(--line)}
.hud .ctr{display:flex;justify-content:center;min-width:0}
.combo{display:flex;align-items:center;gap:6px;font-weight:900;font-size:.9rem;color:var(--amber);background:var(--amber-s);border-radius:999px;padding:3px 12px;visibility:hidden}
.combo.on{visibility:visible}
.combo img{height:24px;width:auto}
.combo.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.3) rotate(-4deg)}}
.hud .score{font-weight:900;font-size:1.02rem;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .where{font-weight:850;font-size:1.02rem;color:var(--ink);letter-spacing:-.02em;min-width:0}
.bar .mono{color:var(--muted);letter-spacing:.04em}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.segs i.on{background:var(--orange)} .segs i.ok{background:var(--green)} .segs i.half{background:var(--amber)} .segs i.no{background:var(--red)}
.timer{height:8px;border-radius:99px;background:var(--line2);position:relative;overflow:hidden}
.timer i{position:absolute;inset:0 auto 0 0;width:calc(var(--left,1)*100%);background:var(--green);border-radius:99px}
.timer.low i{background:var(--red)}
.float{position:absolute;right:20px;top:10px;font-weight:900;font-size:1.5rem;pointer-events:none;animation:floatup .9s ease-out forwards;z-index:5}
.float.plus{color:var(--green)} .float.minus{color:var(--red)}
@keyframes floatup{from{transform:translateY(10px);opacity:0}20%{opacity:1}to{transform:translateY(-34px);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

/* 브리핑 · 설명 */
.brief-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.brief-list li{padding:2px 0 2px 14px;border-left:4px solid var(--tone,var(--orange))}
.brief-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.brief-top .ico{width:84px;height:84px;border-radius:20px;background:var(--sticker);border:1px solid var(--line);display:grid;place-items:center}
.brief-top .ico img{max-width:66px;max-height:66px}
.how{background:var(--soft);border-radius:14px;padding:12px 16px;font-size:.94rem}
.how b{font-weight:800;color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kv div{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;font-size:.9rem}
.kv b{font-weight:800;color:var(--ink);font-size:.98rem}
.lesson{display:flex;flex-direction:column;gap:14px}
.lesson h2 .t2{font-size:1rem;font-weight:700;color:var(--muted);letter-spacing:-.01em}
.lesson .when{font-size:.95rem}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card)}
.layer .k{font-weight:900;font-size:1.25rem;color:var(--orange);line-height:1.1;letter-spacing:-.02em}
.layer .d{font-size:.92rem;min-width:0}
.layer .d b{font-weight:800;color:var(--ink)}
.layer .d .en{font-size:.76rem;color:var(--muted);font-weight:600}
.layer .t{font-size:.76rem;font-weight:800;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
.layer.cookie{background:var(--cookie);border-color:var(--cookie);border-radius:24px;color:#f3e9e2;background-image:radial-gradient(circle,#ffffff1f 1.5px,transparent 2px);background-size:14px 14px}
.layer.cookie .k,.layer.cookie .d b{color:#fff} .layer.cookie .d .en{color:#e3d2c8} .layer.cookie .t{background:#ffffff26;color:#fff}
.layer.cream{background:var(--cream);border-color:#f0e2bd;color:#3a3226;margin-inline:12px}
.layer.cream .d b{color:#2a2118} .layer.cream .d .en{color:#7d6f58} .layer.cream .t{background:#fff;color:#7d6f58}
.layer.key{background:var(--orange-s);border-color:var(--orange-line)}
.layer.tail{border-style:dashed;background:var(--soft)}
.layer.tail .k{color:var(--muted)}
.layers .sep{font-size:.76rem;font-weight:700;color:var(--muted);padding:2px 4px}
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.vs div{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:3px;min-width:0}
.vs b{font-weight:800;color:var(--ink)}
.vs .lab{font-weight:850;color:var(--ink);font-size:.95rem;margin-bottom:2px}
.keyline{background:var(--orange-s);border:1px solid var(--orange-line);border-radius:14px;padding:11px 16px;font-weight:700;color:var(--ink)}
.pager{display:flex;gap:6px;justify-content:center}
.pager i{width:22px;height:5px;border-radius:99px;background:var(--line)} .pager i.on{background:var(--orange)}
.overlay{position:fixed;inset:0;background:rgba(20,16,12,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:50;overflow:auto;padding:16px}
.overlay .card{max-width:760px;margin:12px auto;gap:26px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.cards>div{border:1px solid var(--line);border-top:4px solid var(--c,var(--orange));border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--card)}
.cards>div:nth-child(1){--c:var(--blue)} .cards>div:nth-child(2){--c:var(--purple)} .cards>div:nth-child(3){--c:var(--green)}
.cards b.t{font-weight:850;font-size:1.06rem;color:var(--ink);letter-spacing:-.02em}
.cards .s{font-weight:700;font-size:.9rem;color:var(--c)}
.cards ul{margin:0;padding-left:1.1em;font-size:.86rem;display:flex;flex-direction:column;gap:3px}
.cards .f{font-size:.82rem;font-weight:700;background:var(--soft);border-radius:10px;padding:6px 10px;margin-top:auto}

/* 문제 공통 */
.q-kicker{font-size:.8rem;font-weight:800;color:var(--orange);letter-spacing:.02em}
.q-text{font-size:clamp(1.12rem,2.6vw,1.32rem);font-weight:750;line-height:1.5;color:var(--ink);letter-spacing:-.02em}
.q-text.speech{background:var(--soft);border-radius:16px;padding:14px 18px;font-weight:650}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;color:var(--ink);transition:transform .12s var(--ease),border-color .15s,background-color .15s,box-shadow .2s}
@media (hover:hover){ .opt:not(:disabled):hover{border-color:var(--orange);background:var(--orange-s)} }
.opt:not(:disabled):active{transform:scale(.985)}
.opts.cols .opt{text-align:center;font-weight:800;align-items:center;padding:14px 12px}
.opt:disabled{cursor:default}
.opt .c{font-size:.88rem;font-weight:400;text-align:left;color:var(--text)}
.opt .sub{font-size:.78rem;font-weight:600;color:var(--muted)}
.opt .tag{font-size:.72rem;font-weight:800;align-self:flex-start;padding:2px 9px;border-radius:999px;background:var(--soft)}
.kbd{font:600 .68rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:3px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--card);color:var(--muted)}
.opt>span>.kbd{margin-right:6px}
.best{background:var(--green-s)!important;border-color:var(--green)!important} .best .tag{color:var(--green);background:var(--card)}
.mid{background:var(--amber-s)!important;border-color:var(--amber)!important} .mid .tag{color:var(--amber);background:var(--card)}
.bad{background:var(--red-s)!important;border-color:var(--red)!important} .bad .tag{color:var(--red);background:var(--card)}
.dim{opacity:.55}
.picked{box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 30%,transparent)!important}
.hint{background:var(--blue-s);color:var(--ink);border-radius:12px;padding:8px 14px;font-size:.92rem;font-weight:600}
.hintrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.hintbtn{background:var(--card);border:1.5px dashed var(--blue);color:var(--blue);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.86rem}
.hintbtn:hover{background:var(--blue-s)}

/* O/X 문 */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.door{background:var(--sticker);color:#172033;border:1.5px solid var(--line);border-radius:90px 90px 18px 18px;padding:18px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .15s}
@media (hover:hover){ .door:not(:disabled):hover{transform:translateY(-4px);border-color:var(--orange)} }
.door img{height:92px;width:auto;max-width:100%}
.door .big{font-weight:900;font-size:2.6rem;line-height:1}
.door.o .big{color:#2f64d6} .door.x .big{color:#d23d4b}
.door small{font-weight:800;font-size:.84rem}
.door.right{background:#e5f5ee;border-color:#16875c} .door.wrong{opacity:.45}

/* 그림 */
.mirror{background:var(--soft);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 12px 12px}
.mirror img{height:min(300px,42vh);width:auto;max-width:100%}
.mirror .label{font-weight:850;font-size:1.1rem;color:var(--ink);text-align:center;letter-spacing:-.02em}
.pics{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px}
.picb{background:var(--soft);border:1.5px solid var(--line);border-radius:16px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;color:var(--ink);transition:transform .2s var(--ease),border-color .15s}
@media (hover:hover){ .picb:not(:disabled):hover{transform:translateY(-3px);border-color:var(--orange)} }
.picb img{height:150px;width:auto;max-width:100%;object-fit:contain}
.pics.face .picb img{height:auto;width:100%;max-width:120px;border-radius:10px}
.picb .n{font-size:.74rem;font-weight:900;color:var(--muted);background:var(--card);border-radius:999px;min-width:22px;padding:0 7px}
.picb .c{font-size:.8rem;line-height:1.4;text-align:center;color:var(--text)}

/* 지뢰 */
.script{background:var(--soft);border-radius:16px;padding:16px 18px;font-size:1.02rem;line-height:2.2;color:var(--ink)}
.chip{font:inherit;background:var(--card);border:1.5px dashed var(--muted);border-radius:8px;padding:1px 7px;margin:0 1px;line-height:1.5;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--orange-s);border-style:solid;border-color:var(--orange);color:var(--orange-d)}
.chip.hit{background:var(--green-s);border:1.5px solid var(--green);color:var(--ink)}
.chip.miss{background:var(--red-s);border:1.5px solid var(--red);color:var(--ink)}
.chip.false{background:var(--amber-s);border:1.5px solid var(--amber);color:var(--ink)}
.chip.told{background:var(--blue-s);border:1.5px solid var(--blue);color:var(--ink)}
.chip.safe{border:1.5px solid var(--line);color:var(--muted)}
.why-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.why-list b{color:var(--ink)}

/* 두더지 */
.holes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:500px;margin-inline:auto}
.hole{height:clamp(68px,21vw,100px);min-width:0;border:1.5px solid var(--line);background:var(--soft);border-radius:18px;display:grid;place-items:center;padding:4px;font-weight:800;font-size:.92rem;line-height:1.3;text-align:center;position:relative;overflow:hidden}
.hole::after{content:"";position:absolute;left:20%;right:20%;bottom:9px;height:10px;border-radius:50%;background:var(--ink);opacity:.14}
.hole span{display:block;position:relative;z-index:1;opacity:0;transform:translateY(46px);transition:transform .16s,opacity .1s;background:var(--sticker);color:#172033;border-radius:12px;padding:6px 8px;max-width:100%;box-shadow:0 6px 16px rgba(23,32,51,.18)}
.hole.up span{opacity:1;transform:none}
.hole.pow{background:var(--green-s);border-color:var(--green)} .hole.oops{background:var(--red-s);border-color:var(--red)}
.hole:disabled{cursor:default}
.whack-info{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:.84rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}

/* 순서 */
.slots{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.slot{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:stretch}
.slot .lab{font-size:.8rem;font-weight:850;background:var(--orange-s);color:var(--orange-d);border-radius:12px;display:grid;place-items:center;text-align:center;padding:4px;line-height:1.3}
.slot .lab.cookie{background:var(--cookie);color:#fff;border-radius:16px} .slot .lab.cream{background:var(--cream);color:#5b4a2c}
.slot .lab.tail{background:var(--soft);color:var(--muted);border:1px dashed var(--line)}
.slot .holeb{border:1.5px dashed var(--line);border-radius:12px;background:none;min-height:46px;padding:9px 14px;text-align:left;font-size:.92rem;width:100%;color:var(--muted)}
.slot .holeb.filled{border-style:solid;border-color:var(--orange-line);background:var(--card);color:var(--ink)}
.slot .holeb.given{border-style:solid;border-color:var(--line2);background:var(--soft);color:var(--text)}
.slot .fix{display:block;margin-top:5px;font-size:.84rem;color:var(--green);font-weight:700}
.gap-note{font-size:.76rem;font-weight:700;color:var(--muted);padding:2px 0 2px 102px}
.pool{display:flex;flex-direction:column;gap:8px}
.piece{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.92rem;color:var(--ink);box-shadow:0 4px 12px rgba(23,32,51,.06);transition:transform .12s var(--ease),border-color .15s}
.piece:hover{border-color:var(--orange)}
.piece:active{transform:scale(.985)}

/* 러시 */
.cloze{font-size:clamp(1.1rem,2.8vw,1.35rem);font-weight:750;line-height:1.6;background:var(--soft);border-radius:16px;padding:16px 18px;color:var(--ink)}
.cloze .blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--orange);text-align:center;color:var(--orange)}
.flash-ok{animation:fok .25s} .flash-no{animation:fno .25s}
@keyframes fok{50%{opacity:.55}} @keyframes fno{50%{transform:translateX(5px)}}

/* 보스 */
.boss{display:grid;grid-template-columns:100px minmax(0,1fr);gap:16px;align-items:center}
.boss .pic{background:var(--sticker);border:1px solid var(--line);border-radius:18px;padding:8px;display:grid;place-items:center}
.boss .pic img{width:100%;height:auto}
.boss .pic.nod{animation:nod .5s} .boss .pic.grr{animation:shake .35s}
@keyframes nod{30%{transform:translateY(5px) rotate(2deg)}60%{transform:translateY(-2px)}}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .track{height:10px;border-radius:99px;background:var(--line2);position:relative;overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--orange),#ffb07a);border-radius:99px;transition:width .4s var(--ease)}
.meter .cap{display:flex;justify-content:space-between;font-size:.84rem;gap:8px;color:var(--muted);font-weight:700}
.meter .cap b{color:var(--orange)}

/* 피드백 · 결과 */
.fb{border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;border:1px solid transparent}
.fb.ok{background:var(--green-s);border-color:color-mix(in srgb,var(--green) 30%,transparent)} .fb.half{background:var(--amber-s);border-color:color-mix(in srgb,var(--amber) 30%,transparent)} .fb.no{background:var(--red-s);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.fb .v{font-weight:900;font-size:1.15rem;letter-spacing:-.02em}
.fb.ok .v{color:var(--green)} .fb.half .v{color:var(--amber)} .fb.no .v{color:var(--red)}
.big-stars{font-size:3.4rem;letter-spacing:8px;line-height:1;color:var(--gold)}
.big-stars span{display:inline-block;animation:starin .4s backwards}
.big-stars span:nth-child(2){animation-delay:.2s} .big-stars span:nth-child(3){animation-delay:.4s}
.big-stars .off{color:var(--line)}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tile{background:var(--card);padding:12px 16px;display:flex;flex-direction:column}
.tile span{font-size:.78rem;color:var(--muted)} .tile b{font-size:1.3rem;font-weight:850;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile b.heart{color:var(--red)}
.wrap-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.wrap-list li{background:var(--orange-s);border:1px solid var(--orange-line);border-radius:14px;padding:10px 16px;font-weight:650;color:var(--ink)}
.missed{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
.missed li{border-left:4px solid var(--amber);padding-left:12px}
.missed .t{font-weight:800;color:var(--ink);display:block}
.cert-img{width:100%;height:auto;border:1px solid var(--line);border-radius:14px;display:block;background:#fff}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.steps>li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.steps>li::before{content:counter(s);width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--orange-s);color:var(--orange);font-weight:900;font-size:.86rem}
.steps .col{gap:8px} .steps b{color:var(--ink)}
.check{display:flex;gap:10px;align-items:center;font-weight:800;cursor:pointer;color:var(--ink)}
.check input{width:20px;height:20px;accent-color:var(--orange)}
.confetti{position:fixed;top:-12px;width:9px;height:13px;border-radius:2px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

.pop{animation:rise .42s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
@media (hover:none){ .kbd{display:none} }
@media (max-height:480px){ .hole{height:60px} .hole::after{bottom:5px;height:7px} .mirror img{height:56vh} }
@media (max-width:640px){ .rules{grid-template-columns:1fr} }
@media (max-width:480px){
  .card{padding:18px 16px;border-radius:20px}
  .brand small{display:none}
  .stop{grid-template-columns:54px minmax(0,1fr);padding-right:12px} .stop .dot{width:54px;height:54px} .stop .rec{grid-column:2;align-items:center;flex-direction:row;gap:10px}
  .slot{grid-template-columns:72px minmax(0,1fr)} .gap-note{padding-left:82px}
  .script{font-size:.98rem;padding:14px}
  .fields{grid-template-columns:1fr}
  .layer{grid-template-columns:40px minmax(0,1fr)} .layer .t{grid-column:2;justify-self:start} .layer.cream{margin-inline:6px}
  .picb img{height:118px} .pics.five{--n:3!important}
  .hole{font-size:.84rem} .door img{height:72px}
  .boss{grid-template-columns:76px minmax(0,1fr)}
  .seg.mas img{height:42px} .parade{height:48px}
}

/* 저장 도우미 */
.cert-img{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;-webkit-user-drag:auto}
.saver .card{max-width:760px;margin:12px auto;gap:16px}
.inapp{border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);background:var(--amber-s);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;color:var(--ink);font-size:.94rem}
.inapp>b{color:var(--amber);font-weight:850}
.saver{z-index:65}
@media (max-width:360px){ .top-in{padding:0 12px;gap:8px} .brand{gap:8px} .brand .logo{width:32px;height:32px} .brand b{font-size:.96rem} .pill{padding:5px 9px;font-size:.78rem} .top .right{gap:6px} }
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:80;background:var(--navy);color:#fff;border-radius:16px;padding:10px 12px 10px 18px;display:flex;gap:12px;align-items:center;font-weight:700;font-size:.92rem;box-shadow:0 14px 34px rgba(15,26,51,.4);max-width:calc(100vw - 24px)}
.updbar .btn{padding:8px 14px;flex:none}

/* ───── 면접 준비실: 덧붙인 모양 ───── */
.top{position:sticky;top:0}
textarea{font:inherit;color:inherit}
.fields.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.field textarea,.slotw textarea{border:1.5px solid var(--line);border-radius:12px;-webkit-appearance:none;appearance:none;background:var(--card);padding:11px 14px;font-size:1rem;line-height:1.7;width:100%;color:var(--ink);resize:vertical;min-height:64px;display:block}
.field textarea:focus,.slotw textarea:focus{outline:0;border-color:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 18%,transparent)}
.field input[type=text]::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
.field label.q-sub{font-weight:500;font-size:.86rem;color:var(--muted)}
.none{font-size:.74rem;font-weight:800;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:800;font-size:.92rem;border-radius:999px;padding:10px 20px;z-index:70;box-shadow:0 12px 30px rgba(15,26,51,.35);animation:toastin .25s var(--ease) both;max-width:calc(100vw - 32px);text-align:center}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}}
.ticket .meter .track{height:8px}

/* 질문 목록 */
.dots3{display:inline-flex;gap:4px}
.dots3 i{font-style:normal;font-size:.7rem;font-weight:800;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.dots3 i.on{color:var(--green);background:var(--green-s);border-color:color-mix(in srgb,var(--green) 35%,transparent)}
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;color:var(--ink);transition:border-color .15s,background-color .15s,transform .12s var(--ease)}
@media (hover:hover){ .qrow:hover{border-color:var(--orange);background:var(--orange-s)} }
.qrow:active{transform:scale(.99)}
.qn{width:38px;height:38px;border-radius:12px;background:var(--orange-s);color:var(--orange);font-weight:900;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.qt{display:flex;flex-direction:column;min-width:0}
.qt b{font-weight:800;letter-spacing:-.02em}
.qt small{color:var(--muted);font-size:.84rem}
.qr{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.qr small{color:var(--muted);font-size:.76rem;font-weight:700;font-variant-numeric:tabular-nums}

/* 한 문제 */
.slots-box{gap:10px;transition:filter .2s}
.slots-box.veil textarea{filter:blur(7px);pointer-events:none;user-select:none}
.slotw{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:stretch}
.slab{font-size:.84rem;font-weight:850;background:var(--orange-s);color:var(--orange-d);border-radius:12px;display:grid;place-items:center;text-align:center;padding:6px 4px;line-height:1.3}
.lenrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lenrow b{color:var(--ink);font-size:1.15rem;font-weight:850}
.lenstate{font-weight:800;font-size:.84rem;color:var(--amber)}
.lenstate.ok{color:var(--green)} .lenstate.over{color:var(--red)}
.sw{background:var(--soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sw-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sw-time{font-size:2.2rem;font-weight:900;letter-spacing:-.03em;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;min-width:2.6em}
.sw-bar{height:12px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.sw-bar.len{background:var(--line2)}
.sw-zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--green) 32%,transparent)}
.sw-bar>i{position:absolute;inset:0 auto 0 0;width:0;background:var(--orange);border-radius:99px;opacity:.9}
.warns{display:flex;flex-direction:column;gap:6px}
.warns:empty{display:none}
.warn{background:var(--red-s);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:12px;padding:8px 14px;font-size:.9rem;color:var(--ink)}
.warn b{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.tag2{background:var(--blue-s);color:var(--blue);font-weight:800;font-size:.86rem;border-radius:999px;padding:3px 12px}
.navrow{justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.navrow .btn{white-space:normal;text-align:center}

/* 학생부 · 기출 */
details.area{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
details.area>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 16px;font-size:1.02rem;color:var(--ink)}
details.area>summary::-webkit-details-marker{display:none}
details.area>summary b{font-weight:800;letter-spacing:-.02em}
details.area[open]>summary{border-bottom:1px solid var(--line)}
.an{width:34px;height:34px;border-radius:11px;color:#fff;font-weight:900;display:grid;place-items:center;font-size:1.05rem}
.abody{padding:16px}
.myq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:12px;padding:10px 14px;background:var(--card)}
.myq b{color:var(--ink);font-weight:750}
.myq p{font-size:.9rem}
.k3{font-weight:800;color:var(--orange-d);margin-right:4px}
.addbox{background:var(--soft);border-radius:16px;padding:14px;gap:10px}
.addbox>b{color:var(--ink);font-weight:800}
.exd>summary{cursor:pointer;font-weight:800;font-size:.9rem;color:var(--blue);padding:4px 0}
.exs{display:flex;flex-direction:column;gap:6px;padding-top:8px;max-height:320px;overflow:auto}
.ex{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.9rem;color:var(--text);line-height:1.55}
button.ex:hover{border-color:var(--orange);background:var(--orange-s)}
.ex.static small{color:var(--muted)}

/* 노트 미리보기 */
.paper{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:clamp(18px,4.5vw,44px);display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.p-title{text-align:center;font-size:1.45rem;font-weight:850;letter-spacing:-.02em;margin-bottom:8px}
.p-head{border-collapse:collapse;width:100%;margin-bottom:8px;font-size:.92rem}
.p-head th,.p-head td{border:1px solid var(--muted);padding:6px 10px;text-align:left}
.p-head th{background:var(--soft);width:4.6em;font-weight:800;color:var(--ink);white-space:nowrap}
.p-h{font-size:1.14rem;font-weight:850;margin-top:18px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.p-s{font-size:1rem;font-weight:800;color:var(--orange-d);margin:12px 0 0}
